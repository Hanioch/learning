# pnpm bloque par défaut les scripts d'installation des dépendances.
# Le projet n'a plus aucune dépendance native : seul unrs-resolver, utilisé
# par ESLint, a encore un script d'installation. On l'autorise ici pour que
# `pnpm install` ne s'arrête pas sur ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  unrs-resolver: true
